name: Release

on:
  workflow_dispatch: # Manual trigger only
    inputs:
      dry-run:
        description: "Dry run (no actual release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # ratchet:tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.RELEASE_APP_ID }}
          private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for conventional commits
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # ratchet:denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          # setting `cache-hash` implies `cache: true` and replaces the default of `${{ hashFiles('**/deno.lock') }}`
          cache-hash: ${{ hashFiles('**/deno.json', '**/deno.lock') }}

      - name: Validate code
        run: |
          deno fmt --check
          deno lint
          deno check src/main.ts
          deno test --allow-all

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=(
            "x86_64-unknown-linux-gnu:linux-x64"
            "aarch64-unknown-linux-gnu:linux-arm64"
            "x86_64-apple-darwin:macos-x64"
            "aarch64-apple-darwin:macos-arm64"
            "x86_64-pc-windows-msvc:windows-x64.exe"
          )

          for target_pair in "${targets[@]}"; do
            target="${target_pair%%:*}"
            name="${target_pair##*:}"
            echo "Building claude-cleaner-$name for $target..."
            if ! deno compile --allow-all --target "$target" --output "dist/claude-cleaner-$name" src/main.ts; then
              echo "Error: Failed to build for $target"
              exit 1
            fi
          done

      - name: Verify binaries
        run: |
          echo "Verifying built binaries..."
          ls -lh dist/

          binaries=(
            "claude-cleaner-linux-x64"
            "claude-cleaner-linux-arm64"
            "claude-cleaner-macos-x64"
            "claude-cleaner-macos-arm64"
            "claude-cleaner-windows-x64.exe"
          )

          for binary in "${binaries[@]}"; do
            if [ -f "dist/$binary" ]; then
              echo "✓ $binary exists"
              file "dist/$binary"
            else
              echo "✗ $binary missing"
              exit 1
            fi
          done

          echo "All binaries built successfully"

          # Basic smoke test: verify the Linux binary is executable and
          # reports its version. Foreign-platform binaries (macOS/Windows)
          # cannot be executed on this Linux runner, so only the Linux x64
          # binary is exercised here and in the deeper test below.
          echo ""
          echo "Running smoke test on Linux x64 binary..."
          chmod +x dist/claude-cleaner-linux-x64
          ./dist/claude-cleaner-linux-x64 --version

      - name: Compiled binary smoke test (commit cleaning)
        # Deeper artifact check beyond --version: runs the reusable
        # tests/integration/compiled-binary-smoke.test.ts suite against the
        # actual compiled Linux binary. It performs a real
        # `--commits-only --execute` history rewrite in a throwaway Git repo,
        # asserts the exact cleaned commit message and backup-branch
        # behavior, and proves the child `git filter-branch` self-invocation
        # never shells out to `deno` (a failing `deno` shim is placed first
        # on PATH). Kept as a Deno test rather than inline Bash so the same
        # check can be reused verbatim from CI in the future.
        env:
          CLAUDE_CLEANER_BINARY: ${{ github.workspace }}/dist/claude-cleaner-linux-x64
        run: deno test --allow-all tests/integration/compiled-binary-smoke.test.ts

      - name: Run semantic-release (dry-run)
        if: ${{ inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: npx semantic-release --dry-run

      - name: Run semantic-release
        if: ${{ !inputs.dry-run }}
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: npx semantic-release

      - name: Commit and push version changes
        if: ${{ !inputs.dry-run }}
        run: |
          # Check if there are changes to commit (deno.json and CHANGELOG.md)
          if git diff --quiet HEAD -- deno.json CHANGELOG.md; then
            echo "No version changes to commit"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get the new version from deno.json
          NEW_VERSION=$(jq -r '.version' deno.json)

          # Commit the changes
          git add deno.json CHANGELOG.md
          git commit -m "chore: bump to version ${NEW_VERSION} [skip ci]"

          # Push the commit
          git push origin HEAD:main
